name: CI/CD Workflow

on:
  push:
    branches: [ main ]
    paths: [ "backend/**", ".github/workflows/backend_deploy.yml" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup environment
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv sync --locked --no-dev --no-install-project
        working-directory: ./backend

      - name: Run tests
        run: uv run pytest test/
        working-directory: ./backend

  build:
    runs-on: ubuntu-latest
    needs: [ test ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        run: |
          cd backend
          podman build -t emergency-location .
          podman tag emergency-location docker.io/${{ vars.DOCKERHUB_USERNAME }}/emergency-location:latest

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        run: podman push docker.io/${{ vars.DOCKERHUB_USERNAME }}/emergency-location:latest

      - name: Copy compose.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_SSH_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH }}
          port: 22
          source: "backend/compose.yml"
          target: "/app"
          strip_components: 1

  deploy:
    runs-on: ubuntu-latest
    needs: [test, build]
    steps:
      - name: Start up the backend and the database
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_SSH_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          port: 22
          script: |
            cd /app
            podman rm -f ${{ vars.BACKEND_CNT_NAME }}
            podman rmi ${{ vars.BACKEND_IMAGE }}
            podman pull ${{ vars.BACKEND_IMAGE }}
            podman-compose --env-file=env/.env up -d